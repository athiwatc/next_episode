[package]
name = "next_episode"
version = "0.3.0"
edition = "2015"
authors = ["Athiwat Chunlakhan"]
description = "Find the next possible episode"
repository = "https://github.com/athiwatc/next_episode"
homepage = "https://github.com/athiwatc/next_episode"
license = "Apache-2.0"
readme = "README.md"
exclude = [".vscode"]

[dependencies]
lazy_static = "1.5.1"
regex = "1.13.1"
itertools = "0.15.0"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "my_benchmark"
harness = false
